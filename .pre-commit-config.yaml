---
repos:
  - repo: local
    hooks:
      - id: gradle-test
        name: Gradle tests
        entry: ./gradlew test
        language: system
        pass_filenames: false
        always_run: true
      - id: nixfmt
        name: Nix format
        entry: nix develop ./.nix -c nixfmt --check .nix/flake.nix
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: ShellCheck
        entry: nix develop ./.nix -c shellcheck .envrc
        language: system
        pass_filenames: false
        always_run: true
